name: CI — Operix Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-frontend:
    name: Frontend Quality Gates (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Unit Tests
        run: npm run test

      - name: Frontend Build
        run: npm run build

  validate-backend:
    name: Backend Quality Gates (Typecheck, Prisma, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Backend Typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Backend Build
        working-directory: ./backend
        run: npm run build
