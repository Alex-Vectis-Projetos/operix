server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # .mjs files must be served as JS for ES module workers to load
  types {
    application/javascript js mjs;
    text/css               css;
    text/html              html htm;
    image/svg+xml          svg svgz;
    image/png              png;
    image/jpeg             jpg jpeg;
    image/gif              gif;
    image/webp             webp;
    image/x-icon           ico;
    font/woff              woff;
    font/woff2             woff2;
    application/json       json;
    application/manifest+json webmanifest;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ~* \.(ico|png|svg|jpg|jpeg|webp)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
