services:

  api_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qw_nexus_api_dev_alex
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qwnexus}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/qwnexus_dev?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-jwt-por-uma-string-com-mais-de-32-caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://72.62.27.129:1010
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STRIPE_SANDBOX_API_KEY: ${STRIPE_SANDBOX_API_KEY:-}
      STRIPE_LIVE_API_KEY: ${STRIPE_LIVE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_SANDBOX_URL: ${STRIPE_PORTAL_SANDBOX_URL:-}
      STRIPE_PORTAL_LIVE_URL: ${STRIPE_PORTAL_LIVE_URL:-}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${PAYMENTS_SANDBOX_WEBHOOK_SECRET:-}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${PAYMENTS_LIVE_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      OPENROUTE_API_KEY: ${OPENROUTE_API_KEY:-}
      NASA_API_KEY: ${NASA_API_KEY:-}
      METEOSTAT_RAPIDAPI_KEY: ${METEOSTAT_RAPIDAPI_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-esta-senha-minio-com-16-chars}
    ports:
      - "4010:4000"

  dev_alex:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://72.62.27.129:4010/api
        VITE_PAYMENTS_CLIENT_TOKEN: ${VITE_PAYMENTS_CLIENT_TOKEN:-}
    container_name: qw_nexus_dev_alex
    restart: unless-stopped
    ports:
      - "1010:80"
    depends_on:
      api_dev:
        condition: service_started
