  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('qwork.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
          // Paint a solid background BEFORE React mounts to prevent any
          // ghost/atmospheric layer from being visible during hydration.
          var bg = t === 'dark' ? '#0d1016' : '#f5f6f8';
          document.documentElement.style.backgroundColor = bg;
          document.body && (document.body.style.backgroundColor = bg);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0d1016';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
