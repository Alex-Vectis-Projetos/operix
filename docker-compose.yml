services:
  postgres:
    image: postgres:16-alpine
    container_name: qw_nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qwnexus}
      POSTGRES_USER: ${POSTGRES_USER:-qwnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qwnexus} -d ${POSTGRES_DB:-qwnexus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: qw_nexus_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-esta-senha-minio-com-16-chars}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qw_nexus_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qwnexus}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-qwnexus}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-jwt-por-uma-string-com-mais-de-32-caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: "https://operix-pro.com,http://72.62.27.129:1010"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STRIPE_SANDBOX_API_KEY: ${STRIPE_SANDBOX_API_KEY:-}
      STRIPE_LIVE_API_KEY: ${STRIPE_LIVE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_SANDBOX_URL: ${STRIPE_PORTAL_SANDBOX_URL:-}
      STRIPE_PORTAL_LIVE_URL: ${STRIPE_PORTAL_LIVE_URL:-}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${PAYMENTS_SANDBOX_WEBHOOK_SECRET:-}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${PAYMENTS_LIVE_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      OPENROUTE_API_KEY: ${OPENROUTE_API_KEY:-}
      NASA_API_KEY: ${NASA_API_KEY:-}
      METEOSTAT_RAPIDAPI_KEY: ${METEOSTAT_RAPIDAPI_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-esta-senha-minio-com-16-chars}
    ports:
      - "${API_PORT:-4000}:4000"

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_PAYMENTS_CLIENT_TOKEN: ${VITE_PAYMENTS_CLIENT_TOKEN:-}
    container_name: qw_nexus_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  minio_data:
